<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gray-100 p-6">

  <div class="max-w-5xl mx-auto">

    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold text-gray-800">Admin Dashboard</h1>
      <button id="logoutBtn" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition">
        Logout
      </button>
    </div>

    <table class="min-w-full bg-white rounded-xl shadow-lg overflow-hidden">
      <thead class="bg-blue-600 text-white">
        <tr>
          <th class="p-4 text-left">Name</th>
          <th class="p-4 text-left">Grade</th>
          <th class="p-4 text-left">Report Type</th>
          <th class="p-4 text-left">Location</th>
          <th class="p-4 text-left">Description</th>
        </tr>
      </thead>
      <tbody id="reportsTable" class="divide-y divide-gray-200">
        <!-- Report rows will go here -->
      </tbody>
    </table>
  </div>

  <script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://grkromlvleczjfkrzmol.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdya3JvbWx2bGVjempma3J6bW9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwMjA4NzksImV4cCI6MjA4MDU5Njg3OX0.LsLCiNTbj9kmXEdgtbkSXrEVQgXye0kOQoE35EBx9v0"
);

const logoutBtn = document.getElementById("logoutBtn");

async function init() {
  // 1️⃣ Try to get session from magic link (if coming from email)
  const { data: magicData, error } = await supabase.auth.getSessionFromUrl({ storeSession: true });
  if (error) console.error("Magic link error:", error);

  // 2️⃣ Check existing session
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    // No session? Go back to login
    window.location.replace("/admin-login.html");
    return;
  }

  // Now you have a valid session, you can load your reports
  loadReports();
}

logoutBtn.addEventListener("click", async () => {
  await supabase.auth.signOut();
  window.location.replace("/admin-login.html");
});

async function loadReports() {
  try {
    const res = await fetch("/api/reports"); // your API
    const reports = await res.json();
    const tbody = document.getElementById("reportsTable");
    tbody.innerHTML = "";
    reports.forEach(r => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="p-4">${r.name}</td>
        <td class="p-4">${r.grade_level}</td>
        <td class="p-4">${r.report_type}</td>
        <td class="p-4">${r.location}</td>
        <td class="p-4">${r.description}</td>
      `;
      tbody.appendChild(tr);
    });
  } catch (err) {
    console.error(err);
  }
}

// Initialize dashboard
init();
</script>

</body>
</html>
