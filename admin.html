<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
    }
  </style>
</head>

<body class="min-h-screen bg-gray-100 p-6">

  <div class="max-w-7xl mx-auto">

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold text-gray-800">Admin Dashboard</h1>
      <button
        id="logoutBtn"
        class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition"
      >
        Logout
      </button>
    </div>

    <!-- Reports Table -->
    <div class="bg-white rounded-xl shadow-lg overflow-x-auto">
      <table class="min-w-full">
        <thead class="bg-blue-600 text-white">
          <tr>
            <th class="p-4 text-left">Name</th>
            <th class="p-4 text-left">Grade</th>
            <th class="p-4 text-left">Section</th>
            <th class="p-4 text-left">Report Type</th>
            <th class="p-4 text-left">Location</th>
            <th class="p-4 text-left">Description</th>
            <th class="p-4 text-left">Evidence</th>
          </tr>
        </thead>

        <tbody id="reportsTable" class="divide-y divide-gray-200">
          <tr>
            <td colspan="7" class="p-6 text-center text-gray-500">
              Loading reports...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Supabase -->
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://grkromlvleczjfkrzmol.supabase.co",
      "YOUR_ANON_KEY_HERE"
    );

    const logoutBtn = document.getElementById("logoutBtn");
    const tableBody = document.getElementById("reportsTable");

    // 🔐 Check admin session
    async function init() {
      const { data: { session } } = await supabase.auth.getSession();

      if (!session) {
        window.location.replace("/admin-login.html");
        return;
      }

      loadReports();
    }

    // 🚪 Logout
    logoutBtn.addEventListener("click", async () => {
      await supabase.auth.signOut();
      window.location.replace("/admin-login.html");
    });

    // 📥 Load reports
    async function loadReports() {
      tableBody.innerHTML = "";

      const { data, error } = await supabase
        .from("reports")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        console.error(error);
        tableBody.innerHTML = `
          <tr>
            <td colspan="7" class="p-6 text-center text-red-600">
              Failed to load reports
            </td>
          </tr>
        `;
        return;
      }

      if (!data || data.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="7" class="p-6 text-center text-gray-500">
              No reports found
            </td>
          </tr>
        `;
        return;
      }

      data.forEach(r => {
        let evidenceCell = `<span class="text-gray-400">None</span>`;

        if (Array.isArray(r.evidence) && r.evidence.length > 0) {
          evidenceCell = r.evidence.map(url => {
            const isImage = url.match(/\.(jpg|jpeg|png|gif|webp)$/i);
            return isImage
              ? `<a href="${url}" target="_blank">
                   <img src="${url}" class="w-20 h-20 object-cover rounded-lg border mb-1">
                 </a>`
              : `<a href="${url}" target="_blank" class="text-blue-600 underline block">
                   View File
                 </a>`;
          }).join("");
        }

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="p-4">${r.name ?? "Anonymous"}</td>
          <td class="p-4">${r.grade_level ?? "-"}</td>
          <td class="p-4">${r.section ?? "-"}</td>
          <td class="p-4">${r.report_type ?? "-"}</td>
          <td class="p-4">${r.description_where ?? "-"}</td>

          <td class="p-4 text-sm whitespace-pre-line">
            <strong>Sino:</strong> ${r.description_who || "-"}<br>
            <strong>Ano:</strong> ${r.description_what || "-"}<br>
            <strong>Kailan:</strong> ${r.description_when || "-"}<br>
            <strong>Bakit:</strong> ${r.description_why || "-"}<br>
            <strong>Paano:</strong> ${r.description_how || "-"}
          </td>

          <td class="p-4">${evidenceCell}</td>
        `;

        tableBody.appendChild(tr);
      });
    }

    // 🚀 Start
    init();
  </script>
</body>
</html>
