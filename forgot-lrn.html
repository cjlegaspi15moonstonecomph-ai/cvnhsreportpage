<!DOCTYPE html>
<html lang="fil">
<head>
  <meta charset="UTF-8">
  <title>Forgot LRN</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <h2>Enter Section Code</h2>

  <form id="codeForm">
    <input id="code" placeholder="Section Code" required />
    <button type="submit">Submit</button>
  </form>

  <p id="status"></p>

  <button id="backBtn">Back to Login</button>

  <script>
    const supabase = supabaseJs.createClient(
      "https://grkromlvleczjfkrzmol.supabase.co",
      "YOUR_PUBLIC_ANON_KEY"
    );

    // BACK BUTTON
    document.getElementById("backBtn").onclick = () => {
      window.location.href = "index.html";
    };

    // SUBMIT
    document.getElementById("codeForm").onsubmit = async (e) => {
      e.preventDefault();
      const code = document.getElementById("code").value.trim();
      const status = document.getElementById("status");

      status.textContent = "Verifying...";

      // 1️⃣ check section
      const { data: section, error } = await supabase
        .from("sections")
        .select("*")
        .eq("code", code)
        .single();

      if (error || !section) {
        status.textContent = "Invalid section code";
        return;
      }

      // 2️⃣ get students
      const { data: students } = await supabase
        .from("students")
        .select("*")
        .eq("section", section.section);

      if (!students || students.length === 0) {
        status.textContent = "No students found";
        return;
      }

      localStorage.setItem("student", JSON.stringify(students[0]));
      window.location.href = "index.html";
    };
  </script>
</body>
</html>
