<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-600 via-blue-600 to-cyan-500 p-6">

  <div class="w-full max-w-md backdrop-blur-xl bg-white/20 border border-white/30 rounded-3xl shadow-2xl p-8">

    <h2 class="text-3xl font-bold text-white text-center mb-2">Admin Access</h2>
    <p class="text-center text-white/80 text-sm mb-8">
      Sign in using your authorized Gmail account
    </p>

    <input
      type="email"
      id="email"
      placeholder="admin@gmail.com"
      class="w-full bg-white/90 text-gray-800 p-4 rounded-xl outline-none focus:ring-4 focus:ring-white/40 transition mb-6"
    />

    <button
      onclick="sendOTP()"
      class="w-full bg-white text-blue-700 font-semibold py-4 rounded-xl hover:bg-blue-50 active:scale-[0.98] transition"
    >
      Send One-Time Password
    </button>

    <p id="status" class="text-center font-semibold mt-6 text-sm text-white"></p>
  </div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://grkromlvleczjfkrzmol.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdya3JvbWx2bGVjempma3J6bW9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwMjA4NzksImV4cCI6MjA4MDU5Njg3OX0.LsLCiNTbj9kmXEdgtbkSXrEVQgXye0kOQoE35EBx9v0"
);

window.sendOTP = async () => {
  const email = document.getElementById("email").value;

  const { error } = await supabase.auth.signInWithOtp({
    email,
    options: {
      emailRedirectTo: window.location.origin
    }
  });

  alert(error ? error.message : "Email sent!");
};
</script>



</body>
</html>
