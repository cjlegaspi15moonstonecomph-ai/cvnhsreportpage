<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CVNHS Report Page</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-100 via-indigo-100 to-blue-200 flex justify-center items-center p-4">

<div class="w-full max-w-2xl bg-white/90 backdrop-blur-xl shadow-2xl rounded-3xl p-8">

  <!-- HEADER -->
  <div class="flex flex-col items-center mb-6">
    <img src="cvnhs-logo.png" alt="CVNHS Logo" class="w-24 h-24 mb-3"/>
    <h2 class="text-2xl font-extrabold text-center mb-2 text-blue-700">
      Incident Reporting
    </h2>
    <p class="text-center text-sm text-gray-600 mb-6">
      School Incident Reporting System
    </p>
    <p id="studentName" class="text-center font-semibold text-gray-700 mb-6"></p>
  </div>

  <form id="reportForm" enctype="multipart/form-data" class="space-y-5">

    <!-- Name -->
    <div>
      <label class="font-semibold text-gray-700">Name (Optional)</label>
      <input type="text" name="name" class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-300">
    </div>

    <!-- Grade -->
    <div>
      <label class="font-semibold text-gray-700">Grade Level</label>
      <select name="grade_level" required class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-300 bg-white">
        <option value="">Choose</option>
        <option value="Grade 7">Grade 7</option>
        <option value="Grade 8">Grade 8</option>
        <option value="Grade 9">Grade 9</option>
        <option value="Grade 10">Grade 10</option>
        <option value="Grade 11">Grade 11</option>
        <option value="Grade 12">Grade 12</option>
      </select>
    </div>

    <!-- Section -->
    <div>
      <label class="font-semibold text-gray-700">Section</label>
      <input type="text" id="desc_section" name="section" required class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-300">
    </div>

    <!-- Report Type -->
    <div>
      <label class="font-semibold text-gray-700">Report Type</label>
      <select name="report_type" id="report_type" required class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-300 bg-white">
        <option value="">Choose</option>
        <option value="Bullying">Bullying</option>
        <option value="Harassment">Harassment</option>
        <option value="Physical Violence">Physical Violence</option>
        <option value="Theft">Theft</option>
        <option value="Vandalism">Vandalism</option>
        <option value="Cyber Incident">Cyber Incident</option>
        <option value="Student Misconduct">Student Misconduct</option>
        <option value="Substance Issue">Substance Issue</option>
        <option value="Emergency or Safety Concern">Emergency or Safety Concern</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <!-- Other Report -->
    <div id="otherField" class="hidden">
      <label class="font-semibold text-gray-700">Please Specify</label>
      <input type="text" id="otherInput" class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-300">
    </div>

    <!-- Description -->
    <div>
      <label class="font-semibold text-gray-700">Description</label>
      <div class="space-y-3 mt-2">
        <details class="rounded-xl border bg-gray-50 p-3">
          <summary class="font-semibold cursor-pointer">Saan ito nangyari? ↓</summary>
          <input id="desc_saan" class="w-full mt-2 px-3 py-2 rounded-lg border">
        </details>

        <details class="rounded-xl border bg-gray-50 p-3">
          <summary class="font-semibold cursor-pointer">Sino ang sangkot? ↓</summary>
          <input id="desc_sino" class="w-full mt-2 px-3 py-2 rounded-lg border">
        </details>

        <details class="rounded-xl border bg-gray-50 p-3">
          <summary class="font-semibold cursor-pointer">Ano ang nangyari? ↓</summary>
          <textarea id="desc_ano" rows="3" class="w-full mt-2 px-3 py-2 rounded-lg border"></textarea>
        </details>

        <details class="rounded-xl border bg-gray-50 p-3">
          <summary class="font-semibold cursor-pointer">Kailan ito nangyari? ↓</summary>
          <input id="desc_kailan" class="w-full mt-2 px-3 py-2 rounded-lg border">
        </details>

        <details class="rounded-xl border bg-gray-50 p-3">
          <summary class="font-semibold cursor-pointer">Bakit ito nangyari? ↓</summary>
          <textarea id="desc_bakit" rows="2" class="w-full mt-2 px-3 py-2 rounded-lg border"></textarea>
        </details>

        <details class="rounded-xl border bg-gray-50 p-3">
          <summary class="font-semibold cursor-pointer">Paano ito nangyari? ↓</summary>
          <textarea id="desc_paano" rows="3" class="w-full mt-2 px-3 py-2 rounded-lg border"></textarea>
        </details>
      </div>
    </div>

    <!-- Evidence Upload -->
    <div>
      <label class="font-semibold text-gray-700">Evidence (Images / Videos)</label>
      <input type="file" id="media" name="media" multiple accept="image/*,video/*" class="w-full mt-1 p-2 rounded-xl border bg-white">
      <div id="preview" class="flex flex-wrap gap-2 mt-2"></div>
    </div>

    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold">Submit Report</button>

    <p id="status" class="text-center font-semibold"></p>

    <button type="button" id="logoutBtn" class="w-full mt-3 bg-red-500 hover:bg-red-600 text-white py-2 rounded-xl font-semibold">Logout</button>

  </form>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// Supabase config
const supabase = createClient(
  "https://grkromlvleczjfkrzmol.supabase.co",   // your URL
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdya3JvbWx2bGVjempma3J6bW9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwMjA4NzksImV4cCI6MjA4MDU5Njg3OX0.LsLCiNTbj9kmXEdgtbkSXrEVQgXye0kOQoE35EBx9v0"
);

const user = await supabase.auth.getUser(); // get logged-in user
if (!user.data.user) window.location.href = "/index-login.html";
document.getElementById('studentName').textContent = `Logged in as: ${user.data.user.email}`;

// Logout
document.getElementById("logoutBtn").addEventListener("click", async () => {
  await supabase.auth.signOut();
  window.location.replace("/index-login.html");
});

// Show Other field if report type is "Other"
document.getElementById("report_type").addEventListener("change", function () {
  const otherField = document.getElementById("otherField");
  if (this.value === "Other") otherField.classList.remove("hidden");
  else {
    otherField.classList.add("hidden");
    document.getElementById("otherInput").value = "";
  }
});

// Preview media
const mediaInput = document.getElementById("media");
const preview = document.getElementById("preview");
mediaInput.addEventListener("change", function () {
  preview.innerHTML = "";
  Array.from(this.files).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      const div = document.createElement("div");
      div.className = "w-24 h-24 border rounded-lg overflow-hidden";
      if(file.type.startsWith("image/")) {
        const img = document.createElement("img");
        img.src = e.target.result;
        img.className = "w-full h-full object-cover";
        div.appendChild(img);
      } else if(file.type.startsWith("video/")) {
        const video = document.createElement("video");
        video.src = e.target.result;
        video.controls = true;
        video.className = "w-full h-full object-cover";
        div.appendChild(video);
      }
      preview.appendChild(div);
    };
    reader.readAsDataURL(file);
  });
});

// Submit report
document.getElementById("reportForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  const status = document.getElementById("status");
  status.textContent = "Isinusumite...";
  status.className = "text-gray-700 font-semibold";

  try {
    // Upload media files
    const uploadedUrls = [];
    for (let file of mediaInput.files) {
      const fileExt = file.name.split(".").pop();
      const fileName = `report-${Date.now()}-${Math.random().toString(36).substring(2)}.${fileExt}`;
      const { data, error: uploadError } = await supabase.storage.from("evidence").upload(fileName, file);
      if (uploadError) {
        console.error("Upload error:", uploadError);
        continue;
      }
      const { publicUrl } = supabase.storage.from("evidence").getPublicUrl(fileName).data;
      uploadedUrls.push(publicUrl);
    }

    // Prepare report
    const reportData = {
      user_id: user.data.user.id, // essential for RLS
      name: this.elements["name"].value || "Anonymous",
      grade_level: this.elements["grade_level"].value,
      section: this.elements["section"].value,
      report_type: this.elements["report_type"].value,
      description_where: document.getElementById("desc_saan").value,
      description_who: document.getElementById("desc_sino").value,
      description_what: document.getElementById("desc_ano").value,
      description_when: document.getElementById("desc_kailan").value,
      description_why: document.getElementById("desc_bakit").value,
      description_how: document.getElementById("desc_paano").value,
      evidence: uploadedUrls
    };

    // Insert into Supabase
    const { error: insertError } = await supabase.from("reports").insert([reportData]);
    if (insertError) {
      console.error("Insert error:", insertError);
      status.textContent = "Hindi naisumite ang ulat: " + insertError.message;
      status.className = "text-red-600 font-semibold";
      return;
    }

    // Success
    status.textContent = "Matagumpay na naisumite ang ulat!";
    status.className = "text-green-600 font-semibold";
    this.reset();
    preview.innerHTML = "";
    document.getElementById("otherField").classList.add("hidden");

  } catch (err) {
    console.error(err);
    status.textContent = "May error. Subukang muli.";
    status.className = "text-red-600 font-semibold";
  }
});
</script>

</body>
</html>
