<!DOCTYPE html>
<html lang="fil">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pag-uulat ng Insidente</title>
  <link rel="icon" href="favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-100 to-indigo-200 flex items-center justify-center p-4">

  <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl p-6">

    <!-- Title -->
    <h1 class="text-2xl font-bold text-center text-blue-700 mb-2">
      Pag-uulat ng Insidente
    </h1>

    <!-- Student info -->
    <p id="studentName" class="text-center text-sm font-semibold text-gray-600 mb-4"></p>

    <!-- FORM -->
    <form id="reportForm" class="space-y-4" enctype="multipart/form-data">

      <!-- Name -->
      <div>
        <label class="font-semibold">Iyong Pangalan (Opsyonal)</label>
        <input type="text" name="name"
          class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-blue-400">
      </div>

      <!-- Grade -->
      <div>
        <label class="font-semibold">Antas ng Baitang</label>
        <select name="grade_level" required
          class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-blue-400">
          <option value="">Pumili</option>
          <option>Grade 7</option>
          <option>Grade 8</option>
          <option>Grade 9</option>
          <option>Grade 10</option>
          <option>Grade 11</option>
          <option>Grade 12</option>
        </select>
      </div>

      <!-- Location -->
      <div>
        <label class="font-semibold">Lugar ng Insidente</label>
        <input type="text" name="location" required
          class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-blue-400">
      </div>

      <!-- Type -->
      <div>
        <label class="font-semibold">Uri ng Insidente</label>
        <select name="report_type" id="report_type" required
          class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-blue-400">
          <option value="">Pumili</option>
          <option>Bullying</option>
          <option>Harassment</option>
          <option>Physical Violence</option>
          <option>Theft</option>
          <option>Vandalism</option>
          <option>Cyber Incident</option>
          <option>Other</option>
        </select>
      </div>

      <!-- Other -->
      <div id="otherField" class="hidden">
        <label class="font-semibold">Iba pa (Ilarawan)</label>
        <input type="text" id="otherInput"
          class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-blue-400">
      </div>

      <!-- Description -->
      <div>
        <label class="font-semibold">Paglalarawan</label>
        <textarea name="description" rows="4" required
          class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-blue-400"
          placeholder="Ilarawan ang nangyari..."></textarea>
      </div>

      <!-- Evidence -->
      <div>
        <label class="font-semibold">Ebidensya (Larawan / Video)</label>
        <input type="file" name="media" multiple
          class="w-full mt-1 p-2 border rounded-xl">
      </div>

      <!-- Submit -->
      <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold transition">
        Isumite ang Ulat
      </button>

      <!-- Status -->
      <p id="status" class="text-center font-semibold"></p>

    </form>

    <!-- Logout -->
    <button id="logoutBtn"
      class="mt-4 w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded-xl">
      Logout
    </button>

  </div>

<script>
  // --- Check login ---
  const student = JSON.parse(localStorage.getItem("student"));
  if (!student) {
    window.location.replace("/index-login.html");
  } else {
    document.getElementById("studentName").textContent =
      "Logged in as: " + (student.name || student.lrn);
  }

  // --- Logout ---
  document.getElementById("logoutBtn").onclick = () => {
    localStorage.removeItem("student");
    window.location.replace("/index-login.html");
  };

  // --- Other type toggle ---
  document.getElementById("report_type").onchange = function () {
    document.getElementById("otherField")
      .classList.toggle("hidden", this.value !== "Other");
  };

  // --- Submit ---
  document.getElementById("reportForm").onsubmit = async function (e) {
    e.preventDefault();
    const status = document.getElementById("status");
    const formData = new FormData(this);

    if (formData.get("report_type") === "Other") {
      formData.set("report_type",
        document.getElementById("otherInput").value.trim());
    }

    status.textContent = "Isinusumite...";
    status.className = "text-blue-600 text-center";

    try {
      const res = await fetch("/api/report", {
        method: "POST",
        body: formData
      });

      const result = await res.json();

      if (result.success) {
        status.textContent = "Matagumpay na naisumite!";
        status.className = "text-green-600 text-center";
        this.reset();
        document.getElementById("otherField").classList.add("hidden");
      } else {
        throw new Error();
      }
    } catch {
      status.textContent = "Error sa pagsumite.";
      status.className = "text-red-600 text-center";
    }
  };
</script>

</body>
</html>
